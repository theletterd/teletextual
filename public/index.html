<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teletextual</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="tv">
      <div class="glass" data-mode="text">
        <div class="picture"><div id="player"></div><canvas id="testcard" class="testcard" hidden></canvas></div>
        <div id="screen" class="screen" aria-live="polite"></div>
        <div id="full" class="full" hidden><img alt="Comic at full size"></div>
        <div id="osd" class="osd" hidden></div>
      </div>
    </div>
    <div class="remote" aria-label="Remote control">
      <div class="pad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="ArrowLeft" title="Previous page">P&minus;</button><button data-key="0">0</button><button data-key="ArrowRight" title="Next page">P+</button>
      </div>
      <div class="fast">
        <button data-key="r" class="red" title="Red (R)"></button>
        <button data-key="g" class="green" title="Green (G)"></button>
        <button data-key="y" class="yellow" title="Yellow (Y)"></button>
        <button data-key="c" class="cyan" title="Cyan (C)"></button>
      </div>
      <div class="modes">
        <button data-key="v" title="TV picture (V)">TV</button>
        <button data-key="t" class="on" title="Teletext (T)">Text</button>
        <button data-key="x" title="Text over the picture (X)">Mix</button>
        <button data-key="u" title="Mute (U)">Mute</button>
      </div>
      <div class="misc">
        <button data-key="i">Index</button>
        <button data-key="h" id="hold">Hold</button>
        <button data-key="ArrowDown" title="Next subpage">Sub</button>
      </div>
      <p class="help">Type a page number. Arrows change page. R G Y C for fastext, H to hold, S for scanlines. V, T, X for TV, text and mix; U mutes. In TV mode, numbers change channel.</p>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
