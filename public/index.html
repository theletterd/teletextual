<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teletextual</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="tv">
      <div class="glass" data-mode="text">
        <div class="picture"><div id="player"></div><canvas id="testcard" class="screen-fill" hidden></canvas><canvas id="static" class="screen-fill" hidden></canvas><canvas id="interlude" class="screen-fill" hidden></canvas><div id="nosignal" class="nosignal" hidden>NO SIGNAL</div></div>
        <div id="screen" class="screen" aria-live="polite"></div>
        <div id="full" class="full" hidden><img alt="Comic at full size"></div>
        <div id="osd" class="osd" hidden></div>
        <div id="strap" class="strap" aria-live="polite"></div>
      </div>
    </div>
    <div class="remote" aria-label="Remote control">
      <div class="top">
        <button data-key="power" class="power" title="Power" aria-label="Power">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v8M7.05 6.05a7 7 0 1 0 9.9 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="pad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="ArrowLeft" title="Previous page">P&minus;</button><button data-key="0">0</button><button data-key="ArrowRight" title="Next page">P+</button>
      </div>
      <div class="fast">
        <button data-key="r" class="red" title="Red (R)"></button>
        <button data-key="g" class="green" title="Green (G)"></button>
        <button data-key="y" class="yellow" title="Yellow (Y)"></button>
        <button data-key="c" class="cyan" title="Cyan (C)"></button>
      </div>
      <div class="modes">
        <button data-key="v" title="TV picture (V)">TV</button>
        <button data-key="t" class="on" title="Teletext (T)">Text</button>
        <button data-key="x" title="Text over the picture (X)">Mix</button>
        <button data-key="u" title="Mute (U)">Mute</button>
      </div>
      <div class="misc">
        <button data-key="i">Index</button>
        <button data-key="h" id="hold">Hold</button>
        <button data-key="sub" title="Next subpage, or subtitles in TV mode">Sub</button>
      </div>
    </div>
    <button class="remote-toggle" aria-label="Remote control" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7" r="1.6" fill="currentColor"/><path d="M10 12h4M10 15h4M10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
